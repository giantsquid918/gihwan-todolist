<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오늘의 할 일을 기록하고 차근차근 완료해 보세요."
    />
    <title>오늘의 할 일</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">MY DAILY SPACE</p>
        <h1>오늘의 할 일<span class="title-mark">.</span></h1>
        <p class="subtitle">작은 한 걸음이 하루를 완성해요.</p>
      </header>

      <section class="todo-card" aria-label="할 일 목록">
        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="새로운 할 일을 입력하세요"
            maxlength="120"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit" aria-label="할 일 추가">
            <span aria-hidden="true">+</span>
            <span>추가</span>
          </button>
        </form>

        <div class="list-toolbar">
          <p class="list-title">나의 목록</p>
          <div class="filters" role="group" aria-label="할 일 필터">
            <button class="filter-button is-active" data-filter="all" type="button" aria-pressed="true">전체</button>
            <button class="filter-button" data-filter="active" type="button" aria-pressed="false">진행 중</button>
            <button class="filter-button" data-filter="completed" type="button" aria-pressed="false">완료</button>
          </div>
        </div>

        <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">✦</span>
          <p class="empty-title" id="empty-title">아직 할 일이 없어요</p>
          <p class="empty-description" id="empty-description">위에서 오늘의 첫 할 일을 추가해 보세요.</p>
        </div>

        <footer class="list-footer">
          <span id="remaining-count">남은 할 일 0개</span>
          <button class="clear-button" id="clear-completed" type="button" hidden>완료 항목 지우기</button>
        </footer>
      </section>

      <p class="page-note">차근차근, 나만의 속도로 ✿</p>
    </main>
  </body>
</html>
